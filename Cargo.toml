[workspace]
members = [
    "crates/jocky-ast",
    "crates/jocky-parser",
    "crates/jocky-ir",
    "crates/jocky-crypto",
    "crates/jocky-agent",
    "crates/jocky-lab",
    "crates/jocky-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["JOCKY Research Team <research@jocky-forensics.org>"]
license = "Apache-2.0"
repository = "https://github.com/jocky-project/jocky"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
